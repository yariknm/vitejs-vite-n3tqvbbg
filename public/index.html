<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Swamp Messenger</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0d110f;
            --surface-color: #161c18;
            --surface-hover: #1f2722;
            --text-primary: #e6ede8;
            --text-secondary: #8c9e92;
            --border-color: #233027;
            --accent-color: #164e3b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-color); color: var(--text-primary); height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .container { width: 100%; max-width: 450px; height: 100%; background: var(--surface-color); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* Авторизация */
        .auth-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; flex-direction: column; justify-content: center; padding: 20px; z-index: 10; }
        .auth-title { font-size: 1.5rem; margin-bottom: 20px; font-weight: bold; }
        .input-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 0.8rem; color: var(--text-secondary); }
        .input-group input { padding: 12px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 8px; color: #fff; outline: none; font-size: 1rem; }
        .btn { padding: 12px; background: var(--accent-color); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .error { color: #e06c75; font-size: 0.85rem; margin-bottom: 10px; display: none; }
        .switch-auth { margin-top: 15px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer; text-align: center; }
        .switch-auth span { color: #fff; font-weight: bold; }

        /* Интерфейс чата */
        .chat-header { padding: 15px; border-bottom: 1px solid var(--border-color); background: var(--surface-color); display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* Список пользователей */
        .users-sidebar { width: 140px; border-right: 1px solid var(--border-color); overflow-y: auto; padding: 10px; background: var(--bg-color); }
        .user-item { padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-item:hover, .user-item.active { background: var(--surface-hover); }

        /* Сообщения */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--surface-color); }
        .messages-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.3; }
        .message.incoming { background: var(--bg-color); border: 1px solid var(--border-color); align-self: flex-start; }
        .message.outgoing { background: var(--accent-color); color: #fff; align-self: flex-end; }
        .msg-time { font-size: 0.65rem; opacity: 0.7; text-align: right; margin-top: 2px; }
        .msg-sender { font-size: 0.75rem; font-weight: bold; margin-bottom: 2px; color: #61afef; }

        .chat-input { padding: 10px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
        .chat-input input { flex: 1; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 6px; color: #fff; outline: none; }
        .send-btn { padding: 10px 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <div class="auth-screen" id="authScreen">
            <div id="loginFormContainer">
                <div class="auth-title">Вход в мессенджер</div>
                <div class="error" id="authError"></div>
                <div class="input-group">
                    <label>Логин</label>
                    <input type="text" id="logUser" placeholder="Ваш логин">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="logPass" placeholder="Пароль">
                </div>
                <button class="btn" id="loginBtn">Войти</button>
                <div class="switch-auth" onclick="toggleAuthMode()">Нет аккаунта? <span>Зарегистрироваться</span></div>
            </div>

            <div id="regFormContainer" style="display: none;">
                <div class="auth-title">Регистрация</div>
                <div class="error" id="regError"></div>
                <div class="input-group">
                    <label>Логин</label>
                    <input type="text" id="regUser" placeholder="Придумайте логин">
                </div>
                <div class="input-group">
                    <label>Пароль</label>
                    <input type="password" id="regPass" placeholder="Придумайте пароль">
                </div>
                <button class="btn" id="registerBtn">Создать аккаунт</button>
                <div class="switch-auth" onclick="toggleAuthMode()">Уже есть аккаунт? <span>Войти</span></div>
            </div>
        </div>

        <div class="chat-header">
            <span id="myUsernameDisplay">Профиль</span>
            <span style="font-size: 0.8rem; color: var(--text-secondary);" id="currentChatTitle">Общий чат</span>
        </div>
        
        <div class="main-content">
            <div class="users-sidebar" id="usersListSidebar">
                <div class="user-item active" onclick="selectChat('all')">💬 Общий чат</div>
            </div>
            
            <div class="chat-area">
                <div class="messages-box" id="messagesBox"></div>
                <div class="chat-input">
                    <input type="text" id="msgInput" placeholder="Введите сообщение...">
                    <button class="send-btn" id="sendBtn">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let currentTarget = 'all'; // 'all' или имя конкретного пользователя
        let allMessages = [];

        let isRegMode = false;
        function toggleAuthMode() {
            isRegMode = !isRegMode;
            document.getElementById('loginFormContainer').style.display = isRegMode ? 'none' : 'block';
            document.getElementById('regFormContainer').style.display = isRegMode ? 'block' : 'none';
        }

        document.getElementById('registerBtn').onclick = () => {
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value.trim();
            socket.emit('register', { username, password });
        };

        document.getElementById('loginBtn').onclick = () => {
            const username = document.getElementById('logUser').value.trim();
            const password = document.getElementById('logPass').value.trim();
            socket.emit('login', { username, password });
        };

        socket.on('auth_error', (msg) => {
            const errEl = isRegMode ? document.getElementById('regError') : document.getElementById('authError');
            errEl.style.display = 'block';
            errEl.textContent = msg;
        });

        socket.on('auth_success', (data) => {
            currentUser = data.username;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('myUsernameDisplay').textContent = `@${currentUser}`;
        });

        // Получение списка всех зарегистрированных пользователей
        socket.on('users_list', (users) => {
            const sidebar = document.getElementById('usersListSidebar');
            sidebar.innerHTML = `<div class="user-item ${currentTarget === 'all' ? 'active' : ''}" onclick="selectChat('all')">💬 Общий чат</div>`;
            
            users.forEach(username => {
                if (username !== currentUser) {
                    let div = document.createElement('div');
                    div.className = `user-item ${currentTarget === username ? 'active' : ''}`;
                    div.textContent = `@${username}`;
                    div.onclick = () => selectChat(username);
                    sidebar.appendChild(div);
                }
            });
        });

        function selectChat(target) {
            currentTarget = target;
            document.getElementById('currentChatTitle').textContent = target === 'all' ? 'Общий чат' : `Чат с @${target}`;
            
            // Подсветка активного в сайдбаре
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            renderMessages();
        }

        document.getElementById('sendBtn').onclick = sendMessage;
        document.getElementById('msgInput').onkeypress = (e) => { if(e.key === 'Enter') sendMessage(); };

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            socket.emit('send_message', { to: currentTarget, text });
            input.value = '';
        }

        socket.on('load_messages', (msgs) => {
            allMessages = msgs;
            renderMessages();
        });

        socket.on('new_message', (msg) => {
            allMessages.push(msg);
            renderMessages();
        });

        function renderMessages() {
            const box = document.getElementById('messagesBox');
            box.innerHTML = '';

            allMessages.forEach(msg => {
                // Фильтруем сообщения для отображения (общий чат или личные между текущим юзером и собеседником)
                if (currentTarget === 'all' && msg.to === 'all') {
                    appendMsgBubble(box, msg);
                } else if (currentTarget !== 'all' && ((msg.from === currentUser && msg.to === currentTarget) || (msg.from === currentTarget && msg.to === currentUser))) {
                    appendMsgBubble(box, msg);
                }
            });
            box.scrollTop = box.scrollHeight;
        }

        function appendMsgBubble(box, msg) {
            const div = document.createElement('div');
            const isOutgoing = msg.from === currentUser;
            div.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            
            div.innerHTML = `
                ${!isOutgoing ? `<div class="msg-sender">@${msg.from}</div>` : ''}
                <div>${escapeHtml(msg.text)}</div>
                <div class="msg-time">${msg.time}</div>
            `;
            box.appendChild(div);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
